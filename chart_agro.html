<!DOCTYPE HTML>
<html lang="en">
	<head>
		<meta charset = "UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="charting_library/charting_library.standalone.js"></script>
		<script src="datafeeds/udf/dist/bundle.js"></script>
		<script>
			var saveUserId;
			var menuId;
			var itemList;
			
			//그리드에서 선택된 아이템 필터링
			function convertItemData(data) {
				return data.filter((element) => element !== undefined);
				
			}
				
			//BIMatrix 리포트에서 호출되는 메소드
			function init(initData) {
				saveUserId = initData.userId;
				menuId = initData.menuId;
				
				itemList = convertItemData(initData.itemArray);
				
				if(itemList.length > 0) {
					initOnReady(itemList[0], itemList);
				}else {
					initOnReady(null, null);
				}			
			};
			
			// 디바운스 타이머 적용
			let searchTimeout = null;
								
			function initOnReady(searchSymbol, compareSymbol) {
			
				if(searchSymbol == null) searchSymbol = " ";
				
				const datafeedInfo = {
						onReady: (callback) => {
							//console.log('[onReady]: Method call');
							setTimeout(() => callback(configurationData));
						},
						searchSymbols: (userInput, exchange, symbolType, onResultReadyCallback) => {
						
						},
						resolveSymbol: (symbolName, onSymbolResolvedCallback, onResolveErrorCallback) => {
							// 서버로부터 심볼 정보를 가져옴
							var searchFormData = new URLSearchParams();
							searchFormData.append('symbol', symbolName);
							
							fetch('/matrix/intlportal/tradingView/charts/getAgroSymbolInfo.jsp', {
								method: 'POST',
								headers: {
									'Content-Type': 'application/x-www-form-urlencoded', // URL 인코딩된 데이터 전송
								},
								body: searchFormData
							})
							.then(response => {
								if (!response.ok) {
									throw new Error('Network response was not ok');
								}
								return response.json();
							})
							.then(data => {
								if (data.status == "success") {
									onSymbolResolvedCallback(data.data); // 심볼 정보가 성공적으로 반환되었을 경우
								} else {
									onResolveErrorCallback(data.message);
								}
							})
							.catch(error => {
								console.error('Error:', error);
								onResolveErrorCallback(error); // 오류 발생 시 처리
							});
						},

						getBars: (symbolInfo, resolution, periodParams, onHistoryCallback, onErrorCallback) => {
							var searchFormData = new URLSearchParams();
							searchFormData.append('symbol', symbolInfo.ticker);
							searchFormData.append('resolution', resolution);
							searchFormData.append('from', periodParams.from);
							searchFormData.append('to', periodParams.to);
							
							fetch('/matrix/intlportal/tradingView/datafeeds/agroDatafeed.jsp', {
								method: 'POST',
								headers: {
									'Content-Type': 'application/x-www-form-urlencoded', // Sending URL-encoded form data
								},
								body: searchFormData
							
							})
							.then(response => response.json())
							.then(data => {
								if(data.status == "success") {
									onHistoryCallback(data.data, { noData: false });
								}else if(data.status == "nextData") {
									onHistoryCallback([], { nextTime: data.nextTime });
								}else {
									onHistoryCallback([], { noData: true });
								}
							})
							.catch(err => {
								 console.error('Error:', err);
								 onErrorCallback(err);
							});
						},

						subscribeBars: (symbolInfo, resolution, onRealtimeCallback, subscribeUID, onResetCacheNeededCallback) => {
							// 실시간 데이터 구독 처리
						},

						unsubscribeBars: (subscriberUID) => {
							// 실시간 데이터 구독 해제 처리
						},
				};
				
				const configurationData = {
					// Represents the resolutions for bars supported by your datafeed
					supported_resolutions: ['1D', '1W', '1M', '12M'],
					// The `exchanges` arguments are used for the `searchSymbols` method if a user selects the exchange
					exchanges: [
						{ value: 'exchange', name: 'exchange', desc: 'exchange'}
					],
					// The `symbols_types` arguments are used for the `searchSymbols` method if a user selects this symbol type
					symbols_types: []
				};
				
				var widget = window.tvWidget = new TradingView.widget({
					client_id : menuId,
				  
					user_id: saveUserId,
				  
					//차트의 크기 -> 페이지의 모든 공간을 차지하도록 설정
					fullscreen: true,
					
					//심볼 데이터 설정
					symbol: searchSymbol,
		
					//단일 막대 주기 설정
					interval: "1D",
				  
					//표시될 컨테이너 ID
					container: "tv_chart_container",
				  
					//차트 데이터 제공하는 부분
					datafeed : datafeedInfo,
				  
					//라이브러리가 포함된 폴더의 경로
					library_path:"charting_library/",
				
					//차트 타임존 설정
					timezone : "Asia/Korea",
					
					locale : 'kr',
				  
					//특정 요소 표시하기
					enabled_features: ["custom_resolutions"],
					overrides: {
						"mainSeriesProperties.statusViewStyle.symbolTextSource": "ticker-and-description",
					},
					//특정 요소 숨기기
					disabled_features: ["header_symbol_search", "header_compare", "symbol_search_hot_key", "header_quick_search", "allow_arbitrary_symbol_search_input", "edit_buttons_in_legend", "legend_inplace_edit"], // 심볼 검색 hide 처리
					//서버에서 저장된 차트 레이아웃 리스트를 통해 기존 레이아웃 형태로 표시 가능
					save_load_adapter : {
						charts : [],
						studyTemplates : [],
						drawingTemplates : [],
					
						//서버에 저장된 레이아웃 목록 표시(Load Layout 아이콘 클릭 시 호출)
						getAllCharts : function() {
							console.log('Get All Charts');
							
							var searchFormData = new URLSearchParams();
							searchFormData.append('userId', saveUserId);
							searchFormData.append('menuId', menuId);
							
							return fetch('/matrix/intlportal/tradingView/charts/getAllCharts.jsp', {
								method: 'POST',
								headers: {
									'Content-Type': 'application/x-www-form-urlencoded', // Sending URL-encoded form data
								},
								body: searchFormData
							})
							.then(response => response.json())
							.then(charts => {
								charts.forEach(chart => {
									//console.log("Last Updated:", new Date(chart.lastUpdated)); // 밀리초를 Date 객체로 변환하여 출력
									chart.timestamp = chart.timestamp/1000;
						  
									this.charts.push(chart);
								});
								return charts;
							})
							.catch(err => {
								 console.error('Error:', err);
							});
						},
						//레이아웃 삭제
						removeChart : function(chartId) {
							console.log('Remove Chart:::' + chartId);
							// 특정 차트를 삭제하는 로직 구현
							var searchFormData = new URLSearchParams();
							searchFormData.append('chartId', chartId);
							searchFormData.append('userId', saveUserId);
							searchFormData.append('menuId', menuId);
							
							return fetch('/matrix/intlportal/tradingView/charts/removeChart.jsp', {
								method: 'POST',
								headers: {
									'Content-Type': 'application/x-www-form-urlencoded', // Sending URL-encoded form data
								},
								body: searchFormData
							})
							.then(response => response.json())
							.catch(err => {
								 console.error('Error:', err);
							});
						},
						//레이아웃 저장
						saveChart : function(chartData) {
							console.log('Save Chart');
							
							if(!chartData.id) {
								chartData.id = "";
								chartData.chart_type = "I";
							}else {
								//레이아웃 저장 후 LoadLayout 없이 바로 재저장하는 경우
								if(typeof chartData.id == 'object') {
									chartData.id = chartData.id.id.toString();
								//레이아웃 로드 후 수정하는 경우
								}else {
									chartData.id = chartData.id.toString();
								}
								chartData.chart_type = "U";
							}
							
							chartData.timestamp = new Date().valueOf();
							chartData.user_id = saveUserId;
							chartData.menu_id = menuId;
							chartData.content = JSON.stringify(chartData);

							// 차트를 저장하는 로직 구현
							return fetch('/matrix/intlportal/tradingView/charts/saveLoadChart.jsp', {
								method: 'POST',
								headers: {
									'Content-Type': 'application/json',
								},
								body: JSON.stringify(chartData)
							})
							.then(response => response.json())
							.catch(err => {
								 console.error('Error:', err);
							});
						},
						//다른 차트로 전환될 때 호출
						getChartContent : async function(chartId) {
							console.log('Get One Chart');
							var chartData = {"id" : chartId, "chart_type" : "S", "user_id" : saveUserId, "menu_id" : menuId};
							try {
								const response = await fetch('/matrix/intlportal/tradingView/charts/saveLoadChart.jsp', {
									method: 'POST',
									headers: {
										'Content-Type': 'application/json',
									},
									body: JSON.stringify(chartData)
								});
								const data = await response.json();
								return data.content;
							} catch (err) {
								console.error('Error:', err);
								throw err;  // 에러 발생 시 에러를 던짐
							}
						},
						
						//서버에 저장된 템플릿 목록 표시(템플릿 아이콘 클릭 시 호출)
						getAllStudyTemplates : function() {
						  console.log('Get All Templates');
						  return Promise.resolve(this.studyTemplates);
						},
						removeStudyTemplate : function() {
						  console.log('Remove Templates');
						},
						saveStudyTemplate : function() {
						  console.log('Save Templates');
						},
						getStudyTemplateContent : function() {
						  console.log('Get One Templates');
						},
						
					},	
										
					//시간 및 가격 형식 지정
					custom_formatters : {
						//마우스 오버 시, 날짜형식 지정 (default 일,월,연도)
						dateFormatter : {
						  format : (date) => {
							return date.getUTCFullYear() + "/" + (date.getUTCMonth() + 1) + "/" + date.getUTCDate();
						  }
						},
						
						//시간 축에서 직접 날짜 형식 지정 (default 시간축 3글자 영문 표시)
						tickMarkFormatter : (date, tickMarkType) => {
						  switch(tickMarkType) {
							case 'Year' : 
							  return date.getUTCFullYear() + '년';
							case 'Month' : 
							  return (date.getUTCMonth() +1) + '월';
							case 'DayOfMonth' : 
							  return date.getUTCDate() + '일';
							case 'Time' : 
							  return 'T' + date.getUTCHours() + ':' + date.getUTCMinutes();
							case 'TimeWithSeconds' : 
							  return 'S' + date.getUTCHours() + ':' + date.getUTCMinutes() + ':' + date.getUTCSeconds();
						  }
						  throw new Error('unhandled tick mark type ' + tickMarkType);
						},
					},
				});
				
				widget.onChartReady(function() {
					const chart = widget.chart();
					/*
					widget.chart().createStudy('Overlay', false, false, {
						'priceScale': 'no-scale'  // 가격 스케일을 추가하지 않도록 설정
					});
					*/
					if(compareSymbol != null && compareSymbol.length > 1) {
						// 기본 심볼 외에 추가 심볼을 차트에 오버레이로 추가
						for(var i=1; i<compareSymbol.length; i++) {
							chart.createStudy('Overlay', true, false, {symbol : compareSymbol[i]}, null, {'priceScale': 'as-series'});
						}
					}
				});
			};
			  
		</script>
	</head>

	<body style="margin:0;">
		<div style="height:90%;" id="tv_chart_container"></div>
	</body>
    
</html>
